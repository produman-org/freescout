worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format custom '[$time_local] $status $host "$request" $body_bytes_sent "$http_referer" $http_x_forwarded_for';
    access_log /dev/stdout custom;
    sendfile on;
    #tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 80 default_server;
        server_name _;
        root /app/public;
        index index.php index.html index.htm;


        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }
        # Uncomment this location if you want to improve attachments downloading speed.
        # Also make sure to set APP_DOWNLOAD_ATTACHMENTS_VIA=nginx in the .env file.
        #location ^~ /storage/app/attachment/ {
        #    internal;
        #    alias /var/www/html/storage/app/attachment/;
        #}
        location ~* ^/storage/attachment/ {
            expires 1M;
            access_log off;
            try_files $uri $uri/ /index.php?$query_string;
        }
        location ~* ^/(?:css|js)/.*\.(?:css|js)$ {
            expires 2d;
            access_log off;
            add_header Cache-Control "public, must-revalidate";
        }
        # The list should be in sync with /storage/app/public/uploads/.htaccess and /config/app.php
        location ~* ^/storage/.*\.((?!(jpg|jpeg|jfif|pjpeg|pjp|apng|bmp|gif|ico|cur|png|tif|tiff|webp|pdf|txt|diff|patch|json|mp3|wav|ogg|wma)).)*$ {
            add_header Content-disposition "attachment; filename=$2";
            default_type application/octet-stream;
        }
        location ~* ^/(?:css|fonts|img|installer|js|modules|[^\\\]+\..*)$ {
            expires 1M;
            access_log off;
            add_header Cache-Control "public";
        }
        location ~ /\. {
            deny  all;
        }
    }
}

